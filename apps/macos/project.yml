name: Snorlax
options:
  bundleIdPrefix: io.github.perfectpan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Signing is Automatic so Xcode asks for the owner's Personal Team.
    # A local compile without an Apple ID overrides these on the xcodebuild
    # command line (see README.md). Regenerating the project keeps Automatic.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    # The collector build phase runs pnpm, which lives outside the source tree.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    APP_GROUP_IDENTIFIER: "$(TeamIdentifierPrefix)io.github.perfectpan.snorlax"
packages:
  SnorlaxKit:
    path: SnorlaxKit
targets:
  Snorlax:
    type: application
    platform: macOS
    sources:
      - path: Snorlax
      - path: Helpers/snorlax
        type: file
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      - path: LaunchAgents/io.github.perfectpan.snorlax.refresh.plist
        type: file
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: SnorlaxKit
      - target: SnorlaxWidget
        embed: true
      - sdk: ServiceManagement.framework
      - sdk: WidgetKit.framework
      - sdk: Charts.framework
    preBuildScripts:
      - name: Bundle collector
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          PATH="/opt/homebrew/bin:/usr/local/bin:${PATH:-/usr/bin:/bin}"
          cd "$SRCROOT/../.."
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "error: pnpm is not on PATH; the Snorlax build needs it to bundle the collector" >&2
            exit 1
          fi
          pnpm --filter @rivus/snorlax run build
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/collector"
          mkdir -p "$dest"
          cp "packages/collector/dist/snorlax.mjs" "$dest/snorlax.mjs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.perfectpan.snorlax
        PRODUCT_NAME: Snorlax
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Snorlax/Info.plist
        INFOPLIST_EXPAND_BUILD_SETTINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: Snorlax/Snorlax.entitlements
        ENABLE_APP_SANDBOX: "NO"
  SnorlaxWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: SnorlaxWidget
    dependencies:
      - package: SnorlaxKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.perfectpan.snorlax.widget
        PRODUCT_NAME: SnorlaxWidget
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SnorlaxWidget/Info.plist
        INFOPLIST_EXPAND_BUILD_SETTINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: SnorlaxWidget/SnorlaxWidget.entitlements
        SKIP_INSTALL: "YES"
  SnorlaxKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnorlaxKit/Tests/SnorlaxKitTests
    dependencies:
      - package: SnorlaxKit
        product: SnorlaxKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.perfectpan.snorlax.kit-tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        # Logic tests. An app host would launch Snorlax and must not.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  Snorlax:
    build:
      targets:
        Snorlax: all
        SnorlaxWidget: all
        SnorlaxKitTests: [test]
    test:
      config: Debug
      targets:
        - SnorlaxKitTests
    run:
      config: Debug
    archive:
      config: Release
