packages:
  - packages/*
  - scripts

# Versions shared by workspace packages are declared once here and referenced with "catalog:".
# catalogMode: strict only polices `pnpm add`: adding a package that is already cataloged at a version outside
# the catalog fails the install. It does not police hand-edited package.json files or dependencies the catalog
# does not declare — those install fine, so keep shared versions in the catalog deliberately.
catalogMode: strict
catalog:
  # effect and @effect/platform-node are pinned to the exact version @rivus/agent-kit's
  # peerDependencies.effect names (plan 2.4 D12); both upgrade together with the kit's peer range.
  effect: 4.0.5
  '@effect/platform-node': 4.0.5
  # The bundled vitest peers on a real `vite` range, while vite-plus provides `vite` as this core alias;
  # pnpm can only satisfy that peer through the override below. Keep the version in lockstep with the
  # `vite-plus` entry (same release train; Dependabot does not see the mapping).
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  '@date-fns/tz': 1.5.0
  '@perfectpan/lint-config': github:PerfectPan/lint-config#v0.6.0
  '@rivus/agent-kit': 0.23.0
  '@rivus/agent-kit-collab': 0.23.0
  '@types/node': 24.19.2
  # Pinned exactly (plan 2.4 D13): `cf` takes over from Wrangler as Cloudflare's CLI and delegates its
  # bundling to the package's Wrangler; both upgrade on purpose, not through a floating range.
  cf: 1.0.0-beta.21
  wrangler: 4.152.0
  date-fns: 4.4.0
  plist: 5.0.0
  quicktype: 26.0.0
  typescript: 7.0.2
  vite-plus: 1.3.0
  zod: 4.6.7

# Redirect whatever declares a `vite` range to the vite-plus core alias.
overrides:
  vite@*: 'catalog:'
  # @effect/platform-node's caret range would float @effect/platform-node-shared to a version whose
  # effect peer no longer accepts the pinned 4.0.5; keep the whole effect 4.0.5 train together.
  '@effect/platform-node-shared@*': 4.0.5

peerDependencyRules:
  allowAny:
    - vite

# Reject versions published less than a day ago, in minutes.
minimumReleaseAge: 1440
# The owner's own packages, pinned by docs/plans/0001-snorlax.md 3.10; snorlax tracks their releases
# deliberately instead of waiting out the release-age window.
minimumReleaseAgeExclude:
  - '@rivus/agent-kit'
  - '@rivus/agent-kit-collab'

strictPeerDependencies: true
autoInstallPeers: true

allowBuilds:
  # Its postinstall verifies the platform binary that the bundled vite runs.
  esbuild: true
  # Its postinstall installs the Workers runtime binary that `cf dev` and the Worker tests run on.
  workerd: true

versioning:
  # `pnpm version -r` must delete consumed changesets and write each package's CHANGELOG.md immediately.
  # The default ("registry") keeps changesets until the registry confirms publication, which would keep the
  # Version Packages pull request open forever because the changesets action decides from the remaining files.
  changelog:
    storage: repository
  # All published packages release in lockstep at one shared version: `pnpm version -r` bumps the whole group
  # together and one release tag covers it, which is what scripts/check-release.ts and the publish workflow
  # verify. Add every new published package to the group.
  fixed:
    - ['@rivus/snorlax']
