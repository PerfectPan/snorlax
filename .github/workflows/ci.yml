name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      # Rejects a pending changeset that names a private package, which is never consumed, or that would move
      # @rivus/snorlax to 1.0.0 without `allow-major` in .github/repo-checks.conf.
      - uses: PerfectPan/gh-repo-checks@v1
        with:
          check: release-plan
      - run: pnpm run check

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node
          require-lockfile: true
          cache: true
      - run: pnpm install --frozen-lockfile
      # The whole protocol build regenerates the JSON Schemas, the fixtures and
      # the Swift types, so a zod change without regenerated outputs fails here.
      - name: Regenerate protocol outputs
        run: pnpm --filter @rivus/snorlax-protocol run build
      - name: Fail when regeneration changes anything
        run: |
          paths="packages/protocol/schema packages/protocol/fixtures apps/macos/SnorlaxKit/Sources/SnorlaxKit/Generated"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::Regenerated protocol outputs differ from the committed files:"
            git status --porcelain -- $paths
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: apps/macos
        run: xcodegen generate
      - name: Test
        working-directory: apps/macos
        run: |
          xcodebuild -project Snorlax.xcodeproj -scheme Snorlax -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            test
      # Ad-hoc signing needs no Apple account. It catches an unsigned embedded
      # helper, which only fails the app's CodeSign when signing is on.
      - name: Ad-hoc signed build
        working-directory: apps/macos
        run: |
          xcodebuild -project Snorlax.xcodeproj -scheme Snorlax -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            build
          codesign --verify --deep --strict DerivedData/Build/Products/Debug/Snorlax.app
      # The app ships the license notices of every package the bundled collector inlines next to it;
      # a build phase that copies only snorlax.mjs would ship third-party code without them.
      - name: Check the bundled collector files
        working-directory: apps/macos
        run: |
          for name in snorlax.mjs THIRD_PARTY_LICENSES.md; do
            test -f "DerivedData/Build/Products/Debug/Snorlax.app/Contents/Resources/collector/$name"
          done
