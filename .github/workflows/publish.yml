# The npm trusted publisher of @rivus/snorlax is bound to this file name; see One-Time Setup in
# docs/development/release.md before renaming it. The release jobs come from the shared workflow in
# PerfectPan/gh-repo-checks; docs/development/release.md describes how this repository uses it.
name: Release

on:
  push:
    branches: [main]
  # Rebuilds the version pull request from the current main, or retries a failed publish.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: PerfectPan/gh-repo-checks/.github/workflows/npm-release.yml@v1
    # The shared workflow narrows these per job; only its publish job can request an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # @rivus/snorlax bundles its devDependencies into dist, so `--prod` would skip the code that ships. The filter
      # audits the collector's own dependencies, dev included, but not the trees of the workspace packages it uses:
      # that keeps out the test-only Worker's Cloudflare tooling, and it means a runtime dependency of the bundled
      # @rivus/snorlax-protocol is audited only while packages/collector/package.json also lists it (zod today).
      # Adding `...` to the filter would pull the Worker tooling back in.
      audit-command: pnpm --filter @rivus/snorlax audit --audit-level=high
