# npm Trusted Publishing for @rivus/snorlax is registered against this file name; renaming it requires
# changing the package's trusted publisher on npmjs.com first.
name: Release

on:
  push:
    branches: [main]
  # Rebuilds the version pull request from the current main, or retries a failed publish.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version or publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Pushes the version branch, release tags and GitHub Releases.
      contents: write
      pull-requests: write
      # npm Trusted Publishing exchanges the workflow's OIDC token for a publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # changelog-github looks up the commit that added each change record.
          fetch-depth: 0
          # Keeps the write token out of .git/config while repository code runs; the action pushes through the
          # GitHub API with its own token input.
          persist-credentials: false
      # The setup step runs in ci.yml too, so the release gates run on the same Node.js and pnpm.
      # pnpm/setup installs the pnpm from `packageManager`, installs Node.js from `.node-version` and runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Select release mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

      - name: Check first-publish setup
        if: steps.mode.outputs.mode != 'none'
        run: npm view @rivus/snorlax version --registry=https://registry.npmjs.org/

      - name: Run release gates
        if: steps.mode.outputs.mode == 'publish'
        run: pnpm run check
      - name: Audit production dependencies
        if: steps.mode.outputs.mode == 'publish'
        run: pnpm audit --prod --audit-level=high

      # With pending change records, runs version-packages and opens or updates the draft pull request
      # changeset-release/main -> main; its body lists each package's new changelog section. Review CI before merging. Without pending records, `changeset publish` runs `pnpm publish` for each
      # unpublished public version through Trusted Publishing, and the action creates one tag and one GitHub Release
      # per published package. The version commit goes through the GitHub API, so GitHub signs it.
      - name: Create the version pull request or publish
        if: steps.mode.outputs.mode != 'none'
        uses: changesets/action@v2.1.2
        with:
          # The action runs these commands without a shell.
          version-script: pnpm run version-packages
          publish-script: pnpm exec changeset publish
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          pr-draft: always
